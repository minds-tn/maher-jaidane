<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title | escape }} | {{ site.tagline | escape }}</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="canonical" href="https://minds-tn.github.io/maher-jaidane/">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:url" content="https://minds-tn.github.io/maher-jaidane/">
<meta property="og:image" content="https://www.minds.tn/maher-jaidane.jpg">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":{{ site.title | jsonify }},"headline":{{ site.title | jsonify }},"url":"https://minds-tn.github.io/maher-jaidane/","description":{{ site.description | jsonify }}}
</script>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script>document.documentElement.className='js'</script>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <span class="bar-t">Professional credentials</span>
    <a class="bar-l" href="https://www.linkedin.com/in/maherjaidane/">View LinkedIn profile</a>
  </div>
</header>
<div class="wrap grid">
  <nav class="toc" aria-label="Page navigation">
    <p class="toc-h">Page navigation</p>
    <ul id="toc"></ul>
  </nav>
  <main class="rec">
    <div id="head"></div>
    <div id="content">
{{ content }}
    </div>
  </main>
</div>
<script src="{{ '/assets/enhance.js' | relative_url }}"></script>
</body>
</html>
